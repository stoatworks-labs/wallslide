# Cloudflare deployment for Wallslide.
#
# A static-assets-only Worker: no server code, and there is nowhere for a logo
# to be uploaded to even if something tried. The fleet does NOT use Cloudflare
# Pages — `pages_build_output_dir` fails with "Could not detect a directory
# containing static files", which reads like a missing build step and is really
# the wrong config key. Same shape as aspect-calc, blend-calc and pixel-peeker.
#
# Deploys are automatic: .github/workflows/deploy.yml runs `wrangler deploy` on
# every push to main that touches something a visitor sees. `cf-run npx
# wrangler deploy` is the fallback when Actions is down.
#
# There is NO Cloudflare-side build connected to this repo, and there never was.
# The note that used to be here gave a "build command in the Cloudflare project"
# as though the dashboard was wired up; across the fleet that comment hid sites
# that had gone weeks without shipping. Do not reintroduce one — two things
# deploying the same Worker is worse than one.
#
# `public/_headers` is copied into dist/ by Vite and carries the CSP; the assets
# runtime honours it.
#
# `name` must match the Cloudflare project.

name = "wallslide"
compatibility_date = "2026-07-30"

# The custom domain is declared HERE rather than clicked into the dashboard, which
# is a small divergence from aspect-calc and blend-calc. Declaring it means a
# deploy re-asserts the hostname and the DNS record, so the mapping cannot drift
# away from the repo — and the repo answers "where does this live" on its own.
#
# Fleet convention: a real tool that does its work in the visitor's browser gets
# the bare name; only recorded click-through demos take a `-demo` suffix.
routes = [
  { pattern = "wallslide.stoatworks-labs.com", custom_domain = true }
]

[assets]
directory = "./dist"
